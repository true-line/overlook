# Packaging config (#53, #128). Signed-capable but env-gated: `npm run
# package` forces unsigned builds via the `-c.mac.identity=null` CLI override
# (electron-builder coerces the string to null and skips signing);
# `npm run package:signed` uses the profile-free entitlement baseline, signing with
# CSC_LINK/CSC_KEY_PASSWORD and notarizing via notarytool with
# APPLE_API_KEY (path to .p8) / APPLE_API_KEY_ID / APPLE_API_ISSUER.
# `npm run package:signed:provisioned` validates and embeds a Developer ID
# profile before enabling the restricted Touch ID and iCloud Documents
# entitlements.
# Windows signing uses Azure Trusted Signing (#683), individual-identity
# validation — no local .pfx/.p12. electron-builder authenticates to
# Microsoft Entra ID via AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET
# (an EnvironmentCredential-compatible service principal; see SIGNING.md). The
# Package workflow forces `-c.win.azureSignOptions=null` on the Windows legs
# when those secrets are absent, so the build stays unsigned rather than
# failing outright. azureSignOptions and signtoolOptions are mutually
# exclusive in electron-builder 25+ — only one may be set under `win`.
appId: com.zts1.overlook
productName: Overlook
directories:
  output: release
# Ship the project license and the generated third-party attributions inside
# the packaged app (#461). They land in Contents/Resources so every
# distributed build carries the notices the bundled dependencies require.
extraResources:
  - LICENSE
  - THIRD-PARTY-NOTICES.md
files:
  - out/**
  # The workspace is linked during packaging, so electron-builder otherwise
  # copies native build inputs and a duplicate node-gyp output. Runtime needs
  # only the runtime loaders, package metadata, and the N-API prebuilds.
  - '!node_modules/@overlook/touch-id/binding.gyp'
  - '!node_modules/@overlook/touch-id/build/**'
  - '!node_modules/@overlook/touch-id/install.cjs'
  - '!node_modules/@overlook/touch-id/prepare-prebuild.cjs'
  - '!node_modules/@overlook/touch-id/test*.cjs'
  - '!node_modules/@overlook/touch-id/touch_id.mm'
  - '!node_modules/@overlook/touch-id/icloud_drive.mm'
  - '!node_modules/@overlook/touch-id/raw_preview.mm'
  - '!node_modules/@overlook/touch-id/native_drag.mm'
  - '!node_modules/@overlook/touch-id/photokit.mm'
  - '!node_modules/@overlook/touch-id/file_provider.mm'
  - '!node_modules/@overlook/touch-id/library_master.mm'
  - '!node_modules/@overlook/windows-interop/binding.gyp'
  - '!node_modules/@overlook/windows-interop/build/**'
  - '!node_modules/@overlook/windows-interop/install.cjs'
  - '!node_modules/@overlook/windows-interop/prepare-prebuild.cjs'
  - '!node_modules/@overlook/windows-interop/test*.cjs'
  - '!node_modules/@overlook/windows-interop/windows_pipe.cc'
# Everything ships bundled by electron-vite (no runtime node_modules yet);
# native modules must land in "dependencies" so electron-builder includes and
# verifies them. Every shipped native dependency is Node-API or a loadable
# extension: npm ci installs its reviewed prebuild, SQLite's inferred install
# script is explicitly denied, and the root postinstall does not invoke
# install-app-deps. Rebuilding here would make electron-rebuild treat SQLite
# v13's bundled binding.gyp as an ABI module.
npmRebuild: false
# Native Node-API binaries cannot execute from inside app.asar. Keep those
# bindings beside the archive, but unpack shared libraries only for the two
# exact-pinned runtimes that dlopen them.
# onnxruntime-node and better-sqlite3-multiple-ciphers v13 bundle every platform
# in one package, so each build would otherwise ship foreign binaries it can
# never load — and on Windows that fails verify-windows-arch (#683). The hook
# takes the target from the packer, which a static `files` pattern cannot do:
# cross-compiled Windows arm64 needs the opposite exclusion from x64 on the
# same runner.
afterPack: scripts/prune-foreign-binaries.mjs
asarUnpack:
  - '**/*.node'
  - 'node_modules/onnxruntime-node/**/*.{dylib,so,dll}'
  - 'node_modules/sqlite-vec*/**/*.{dylib,so,dll}'
# Production runtime hardening (#460). electron-builder flips these fuses on the
# packaged binary before signing, so signed and notarized builds ship with them
# baked in:
#   - runAsNode off: the packaged app ignores ELECTRON_RUN_AS_NODE, so it can
#     never be relaunched as a bare Node process. Safe here — the thumbnail
#     worker uses worker_threads (new Worker), not process.fork.
#   - cookie encryption on: the on-disk cookie store is OS-encrypted.
#   - NODE_OPTIONS / NODE_EXTRA_CA_CERTS and --inspect/--inspect-brk ignored:
#     removes two standard code-injection / debugger footholds in production.
#   - onlyLoadAppFromAsar + embedded asar integrity validation: Electron loads
#     app code only from app.asar and validates its hash against the value
#     electron-builder embeds in Info.plist, so tampered/added code cannot load.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
# App icons live in build/ (electron-builder's default buildResources dir),
# regenerated from the design handoff via scripts/generate-app-icons.sh
# (#236). Committed so CI needs no icon tooling.
mac:
  icon: build/icon.icns
  extendInfo:
    NSFaceIDUsageDescription: Unlock Overlook with Touch ID.
    NSPhotoLibraryUsageDescription: Import only the Apple Photos items you explicitly review and select.
    NSPhotoLibraryAddUsageDescription: Export only the Overlook photos you explicitly select into Apple Photos.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Overlook Library
        CFBundleTypeRole: Viewer
        CFBundleTypeIconFile: icon.icns
        LSHandlerRank: Owner
        LSTypeIsPackage: true
        LSItemContentTypes:
          - com.zts1.overlook.library
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.zts1.overlook.library
        UTTypeDescription: Overlook Library
        UTTypeConformsTo:
          - com.apple.package
        UTTypeTagSpecification:
          public.filename-extension:
            - overlooklibrary
  target:
    - dmg
    - zip
  # Notarization requires the hardened runtime; entitlements come from
  # our pinned profile-free copy of electron-builder's Electron template.
  # Restricted identity and iCloud entitlements are enabled only by the explicit
  # provisioned packaging path; signing them without a profile prevents launch.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  # Helpers/native children get only Electron's runtime allowances; Keychain
  # custody and iCloud container access stay on the main executable's identity.
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # The File Provider extension has a separate sandboxed identity. Preserve
  # electron-builder's per-file policy while selecting its reviewed entitlement
  # set for the nested appex executable and bundle.
  sign: scripts/sign-macos-app.mjs
  # Runs only after a successful signing pass, and skips with a warning when
  # the APPLE_API_* env vars are absent — so unsigned builds are unaffected.
  notarize: true
win:
  icon: build/icon.ico
  # Architecture-qualified installer names (#683). The x64 and arm64 legs both
  # publish into the same release, so the arch MUST be in the filename or the
  # two NSIS installers overwrite each other on download-merge.
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Azure Trusted Signing (#683). electron-builder drives the `TrustedSigning`
  # PowerShell module against this Trusted Signing Account + Certificate
  # Profile, authenticating with the AZURE_TENANT_ID/AZURE_CLIENT_ID/
  # AZURE_CLIENT_SECRET service principal (see SIGNING.md). File/timestamp
  # digest default to SHA-256 and the timestamp server defaults to Microsoft's
  # own RFC 3161 endpoint, so neither needs overriding here.
  azureSignOptions:
    publisherName: Christopher Kane # must match the Trusted Signing cert's CN exactly
    endpoint: https://eus.codesigning.azure.net/ # region-specific
    codeSigningAccountName: zts1
    certificateProfileName: overlook
  target:
    - nsis
