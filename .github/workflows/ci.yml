name: CI
run-name: CI ${{ github.event_name }} purpose=${{ inputs.purpose || 'automatic' }} retries=${{ inputs.e2e_retries || '0' }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      purpose:
        description: Why the complete suite is being run manually
        required: true
        type: choice
        options:
          - exact-sha-preflight
          - diagnostics
          - release-recovery
          - workflow-testing
          - explicit-rerun
      e2e_workers:
        description: Electron E2E workers (capacity measurement; default 1)
        required: false
        type: choice
        options: ['1', '2', '3']
        default: '1'
      e2e_retries:
        description: Electron E2E retries (default 0; increase only for diagnosis)
        required: false
        type: choice
        options: ['0', '1', '2']
        default: '0'
      capacity_label:
        description: Label stored with runner-capacity evidence
        required: false
        type: string
        default: default

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
      release_gate_mode: ${{ steps.policy.outputs.release_gate_mode }}
    steps:
      - id: policy
        uses: true-line/trueline-agent-ci/.github/actions/ci-policy@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad

  merge-evidence:
    name: Verify merged commit evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful merge-group CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Identify CI runs by `.path` ONLY: a run's `.name` is its evaluated
          # `run-name:` (this workflow has one), so `.name == "CI"` matches
          # nothing. `.display_title` below is deliberate — it IS the run-name,
          # and pins the specific exact-sha-preflight dispatch.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find successful manual complete suite for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .display_title == "CI workflow_dispatch purpose=exact-sha-preflight retries=0" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  zizmor:
    name: zizmor / unpinned-uses
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # upload-sarif resolves the current workflow run through the workflow-runs
      # API before it uploads; without actions: read that call is refused with
      # "Resource not accessible by integration" and the gate never goes green.
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  # Explicit cancellation status still permits intentionally skipped evidence jobs.
  # always() here would keep superseded work alive after cancellation (#1246).
  ci:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    # The outer bound on this job. CI calls the :inner entrypoints directly — the guard
    # has no CI exemption (runner-local evidence is replayable), so the wrapped scripts'
    # --timeout-s values never apply here; the per-step timeout-minutes below are what
    # bound an individual hang, and this is the backstop over their sum plus checkout/
    # npm ci/lint/format/build/Playwright-install.
    timeout-minutes: 102
    env:
      INTEROP_IMAGE_TRAIL_ROOT: ${{ github.workspace }}/node_modules/.interop-image-trail
      # The type-aware lint (eslint with recommendedTypeChecked) needs more than
      # the runner's default ~2 GB Node heap on this codebase; at the default
      # ceiling the Lint step dies with "JavaScript heap out of memory" and
      # exit code 134. The runner has 16 GB, so 4 GB is comfortably inside it.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so lint:new-files can compute a merge-base with origin/main;
          # the default single-commit fetch made that gate silently skip in PR runs.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Single source of truth: CI and local resolve Node from the same .nvmrc, so versions
          # never drift. `npm run ci` mirrors this job's gates (lint, format:check, test:cov,
          # build); bump .nvmrc to move local and CI together.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install locked dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '900'
          attempts: '2'
          retry-delay-seconds: '5'

      # Keep the companion checkout under the already-ignored dependency tree:
      # repo-wide Photos lint and package-pin scans must not treat Image Trail as
      # local source, while the acceptance gate still reads its pinned evidence.
      - name: Checkout pinned Image Trail acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/image-trail
          ref: cf3fe884c7729db73cfe0ddb7c90be6c4d881c09
          path: node_modules/.interop-image-trail
          persist-credentials: false

      - name: Interop acceptance
        run: npm run check:interop-acceptance

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Changesets
        # `changeset status` resolves the configured base branch by its local
        # name. A PR checkout has origin/main but does not create local main.
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      # A source PR proves release intent by carrying a changeset. The generated
      # Version packages PR has already consumed those changesets into
      # package.json and CHANGELOG.md, so asking it for one can never pass —
      # that broke #890 (playbook-engineering#134). The shared policy decides
      # which of the two this run is, from reviewed configuration plus fields
      # only GitHub controls; a branch name or author string here would be
      # forgeable and would drift from the other governed repos.
      - name: Check changesets
        if: needs.policy.outputs.release_gate_mode != 'generated-projection'
        run: npm run check:changesets

      # Acceptance-coverage gates (#82): the map validator (every spec mapped,
      # every path exists) + the diff gate (renderer changes must account for
      # their acceptance impact; PR body/labels are read live via gh when
      # available and fall back to the signed event snapshot during API outages).
      - name: Acceptance coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:acceptance-coverage

      # The static half of the a11y gate (#398): shape, path existence, and owned debt.
      # The counts themselves are enforced at runtime by the Storybook and E2E axe lanes
      # below — those need a browser, this does not, so it fails fast and cheap.
      - name: A11y violation budget
        run: npm run check:a11y-budget

      # NODE_OPTIONS adds a second node:test reporter that turns failures into GitHub annotations
      # (file/line-anchored ::error in the run summary) — without it a red test step shows only a
      # blank "Error:" in the UI. CI-only by construction: the flags live here, not in package.json,
      # so local runs keep the plain spec output. Non-test node processes under the same step (tsc,
      # c8, npm itself) accept and ignore the flags.
      - name: Test
        # Step-level bound, replacing the guard's --timeout-s 900 (the :inner entrypoint
        # runs unwrapped here).
        timeout-minutes: 20
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=node-test-github-reporter --test-reporter-destination=stdout
        run: npm run test:cov:inner

      # No guard diagnostics step here: this job invokes the :inner entrypoint, so
      # tools/agent-guard/run-guarded.mjs never runs and never writes .guard/last-run.json
      # on a runner. Hosted runners are disposable and bounded by timeout-minutes; the
      # guard exists for local machines.

      # Render c8 totals vs. the floor into the run summary. Runs even when test:cov failed
      # (dropped below the floor) — that is when the numbers matter most.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: npm run coverage:summary

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info

      - name: Build
        run: npm run build

      # Storybook interaction tests (#56): static build served over http,
      # test-runner drives it with Playwright chromium. Kept in this job (not
      # the Electron E2E job) — it needs a browser, not a display server.
      #
      # The whole job is lifecycle-gated, so Storybook runs only as part of a
      # complete suite; draft events start no jobs.
      - name: Install Playwright browsers (interaction tests)
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install Playwright Chromium for interaction tests
          executable: npx
          arguments-json: '["playwright","install","--with-deps","chromium"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      # Step-level bound: the :inner entrypoint runs without the guard's --timeout-s 1800,
      # so without this a hung Storybook run would burn the whole job timeout instead of
      # failing this step. No guard diagnostics follow it — the guard never runs here and
      # writes no .guard/last-run.json on a runner.
      # Same shape as the E2E step: the failing stories and the axe verdicts are surfaced as a
      # ::error annotation, because a red step otherwise shows only a blank "Error:" in the UI
      # and the raw log is the only other place the detail lands.
      - name: Storybook interaction tests
        timeout-minutes: 30
        run: |
          set +e
          mkdir -p test-results
          npm run test:stories:ci:inner 2>&1 | tee test-results/stories-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            node scripts/annotate-storybook-failures.mjs test-results/stories-output.log
          fi
          exit "$status"

  # Required Windows parity for every complete-suite decision. Coverage and the
  # exhaustive browser lanes stay on Ubuntu; Windows proves the full unit/DOM
  # contract plus one production copy-import path through Electron.
  windows-tests:
    name: Windows x64 tests and import
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      needs.policy.outputs.run_full == 'true' &&
      needs.preflight-evidence.outputs.validated != 'true'
    runs-on: windows-latest
    timeout-minutes: 67
    env:
      INTEROP_IMAGE_TRAIL_ROOT: ${{ github.workspace }}/node_modules/.interop-image-trail
      OVERLOOK_E2E_WORKERS: '1'
      OVERLOOK_E2E_RETRIES: '0'
    steps:
      - name: Configure LF checkout
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Assert native x64 runner
        run: node scripts/assert-platform.mjs win32 x64
      - name: Install dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install locked Windows test dependencies
          executable: cmd.exe
          arguments-json: '["/d","/s","/c","npm ci"]'
          timeout-seconds: '900'
          attempts: '2'
          retry-delay-seconds: '5'
      - name: Checkout pinned Image Trail acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/image-trail
          ref: cf3fe884c7729db73cfe0ddb7c90be6c4d881c09
          path: node_modules/.interop-image-trail
          persist-credentials: false
      - name: Unit and DOM tests
        timeout-minutes: 20
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=node-test-github-reporter --test-reporter-destination=stdout
        run: npm run test:inner
      - name: Real copy-import E2E
        timeout-minutes: 15
        run: npm run test:e2e:windows-import:inner
      - name: Upload Windows Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-windows-x64
          path: playwright-report/
          retention-days: 14

  # Full-suite policy approval is required before scheduling owner-provided hardware.
  dml-arm64-qualification:
    name: Native ARM64 DirectML qualification
    needs: policy
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      needs.policy.outputs.run_full == 'true' &&
      vars.OVERLOOK_DML_ARM64_RUNNER == 'true'
    runs-on: [self-hosted, Windows, ARM64]
    timeout-minutes: 20
    # Command-scope config covers checkout and cleanup without changing the laptop.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Verify command-scoped LF checkout
        shell: pwsh
        run: |
          $setting = git config --show-scope --get core.autocrlf
          if ($LASTEXITCODE -ne 0 -or $setting -notmatch '^command\s+false$') {
            throw 'DirectML checkout requires command-scoped core.autocrlf=false'
          }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          architecture: arm64
      - name: Assert native ARM64 runner and record adapters
        shell: pwsh
        run: |
          node scripts/assert-platform.mjs win32 arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, Status | Format-List
      - name: Install locked dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install native ARM64 DirectML qualification dependencies
          executable: cmd.exe
          arguments-json: '["/d","/s","/c","npm ci"]'
          timeout-seconds: '600'
          attempts: '1'
      - name: Assert native Electron architecture
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npx --no-install electron scripts/assert-platform.mjs win32 arm64
      - name: Qualify native worker without CPU substitution
        timeout-minutes: 5
        env:
          OVERLOOK_DML_QUALIFICATION: '1'
        run: npm run test:embedding-native:inner

  # Main always executes the source import on both native Windows architectures,
  # even when exact merge-group evidence lets the Ubuntu suite use its short smoke.
  windows-main-smoke:
    name: Windows ${{ matrix.arch }} source import
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 47
    env:
      OVERLOOK_E2E_WORKERS: '1'
      OVERLOOK_E2E_RETRIES: '0'
    steps:
      - name: Configure LF checkout
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Assert native runner architecture
        run: node scripts/assert-platform.mjs win32 ${{ matrix.arch }}
      - name: Install dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install locked native Windows smoke dependencies
          executable: cmd.exe
          arguments-json: '["/d","/s","/c","npm ci"]'
          timeout-seconds: '900'
          attempts: '2'
          retry-delay-seconds: '5'
      - name: Real source copy-import smoke
        timeout-minutes: 15
        run: npm run test:e2e:windows-import:inner
      - name: Upload native Windows Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-windows-${{ matrix.arch }}-main
          path: playwright-report/
          retention-days: 14

  # E2E is its own complete-suite job so it runs in parallel with the
  # lint/unit/build lane. test:e2e builds once via Playwright global setup.
  e2e:
    name: E2E
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    # The only bound on this job. This job runs test:e2e:inner directly, without the
    # guard's --timeout-s 1800 (30 min). 45 keeps headroom over the test step's 30 —
    # checkout/npm ci/Electron system deps run before the test step and the report
    # upload runs after it.
    timeout-minutes: 93
    env:
      OVERLOOK_E2E_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_workers || '1' }}
      OVERLOOK_E2E_RETRIES: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_retries || '0' }}
      OVERLOOK_CAPACITY_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.capacity_label || 'default' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install locked dependencies for E2E
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '900'
          attempts: '2'
          retry-delay-seconds: '5'

      # The lane drives the real Electron app (no downloaded browser): Electron
      # brings its own Chromium but needs the OS libraries and a display server.
      # install-deps covers the shared libraries; xvfb provides the display.
      - name: Install Electron system dependencies
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install Electron Chromium system dependencies
          executable: npx
          arguments-json: '["playwright","install-deps","chromium"]'
          timeout-seconds: '600'
          attempts: '2'
          retry-delay-seconds: '5'

      - name: Install Xvfb
        uses: true-line/trueline-agent-ci/.github/actions/bounded-command@8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
        with:
          task: Install Xvfb
          executable: sudo
          arguments-json: '["apt-get","-o","Acquire::Retries=3","install","--yes","xvfb"]'
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'

      # Materialize the Electron binary BEFORE tests: parallel workers racing
      # the lazy first-run download exec a half-written binary (ETXTBSY).
      # Idempotent when the postinstall already fetched it.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      # Step-level bound, replacing the guard's --timeout-s 1800 (the :inner entrypoint
      # runs unwrapped here). It must stay below the job's timeout-minutes so a hung Playwright run
      # fails this step and the report upload below still runs, instead of GitHub
      # cancelling the whole job with no artifact.
      - name: Playwright E2E tests (Electron under Xvfb)
        timeout-minutes: 30
        run: |
          set +e
          xvfb-run --auto-servernum -- node scripts/measure-runner-capacity.mjs -- npm run test:e2e:inner 2>&1 | tee test-results/e2e-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 60 test-results/e2e-output.log | head -c 6000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error file=tests/e2e/offload-ui.spec.ts,line=23,title=E2E failure::$detail"
          fi
          exit "$status"

      - name: Runner capacity summary
        if: ${{ !cancelled() }}
        run: cat test-results/runner-capacity.json || true

      - name: Upload runner capacity evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-capacity-${{ github.run_attempt }}-${{ env.OVERLOOK_E2E_WORKERS }}w
          path: test-results/runner-capacity.json
          retention-days: 30

      # The HTML report is a self-contained clickable app (per-test steps, and screenshots /
      # videos / time-travel traces on failure). Upload it even when the E2E step fails —
      # that is exactly when it matters. View: download, unzip, `npx playwright show-report <dir>`.
      # This artifact is the only report channel: the job that mirrored it to GitHub Pages was
      # removed rather than create a GitHub-owned publishing exception or hand a repo-scoped
      # PAT to a third-party publishing action.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Stable required E2E verdict. Exact-SHA manual evidence supplies this context
  # when the ready run reuses its complete suite.
  e2e-gate:
    name: E2E gate
    needs: [policy, merge-evidence, preflight-evidence, e2e]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify E2E result
        run: |
          e2e='${{ needs.e2e.result }}'
          echo "E2E job: $e2e"
          test "$e2e" = success

  # Documentation governance (ENG-0009): the shared, zero-dependency docs-gov gate,
  # consumed from true-line/trueline-agent-docs-gov per ENG-0004's reusable-workflow model so a
  # governance fix propagates to every repo without per-repo edits. photos' own rules —
  # include globs, indexes, token budgets, ADR Status field, stale-path scope — live in
  # docs-gov.config.json at the repo root (the workflow's default config path). A
  # deterministic gate like lint/format, so every complete suite includes it.
  docs-gov:
    name: Docs governance
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    uses: true-line/trueline-agent-docs-gov/.github/workflows/docs-governance.yml@67db7dc9c20bc29222fb605b7ff9432fd58a2a3f # qwts-agent-docs-gov 2026-09-15
    with:
      tooling-ref: 67db7dc9c20bc29222fb605b7ff9432fd58a2a3f

  codeql:
    name: Advanced CodeQL
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      !cancelled() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  workflow-runtime:
    name: Workflow runtime policy
    needs: policy
    if: needs.policy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned runtime checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/trueline-agent-ci
          ref: 8ec38da39c9b43af2181d1f5e5b7e09226c0bfad
          path: .ci-runtime-policy
          sparse-checkout: tools/ci-runtime
          persist-credentials: false

      - name: Enforce bounded workflow runtime
        run: node .ci-runtime-policy/tools/ci-runtime/runtime-policy.mjs --root "$GITHUB_WORKSPACE"

  post-merge:
    name: Post-merge smoke
    needs: [policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEROP_IMAGE_TRAIL_ROOT: ${{ github.workspace }}/.interop-image-trail
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Checkout pinned Image Trail acceptance evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/image-trail
          ref: cf3fe884c7729db73cfe0ddb7c90be6c4d881c09
          path: .interop-image-trail
          persist-credentials: false
      - name: Interop integration smoke
        run: npm run check:interop-acceptance

  gate:
    name: CI
    needs:
      [
        policy,
        merge-evidence,
        preflight-evidence,
        ci,
        windows-tests,
        windows-main-smoke,
        dml-arm64-qualification,
        e2e-gate,
        docs-gov,
        codeql,
        workflow-runtime,
        post-merge,
      ]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
      - name: Enforce the selected lifecycle lane
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          COMPLETE: ${{ needs.ci.result }}
          WINDOWS_TESTS: ${{ needs.windows-tests.result }}
          WINDOWS_MAIN: ${{ needs.windows-main-smoke.result }}
          DML_ARM64: ${{ needs.dml-arm64-qualification.result }}
          DML_ARM64_ENABLED: ${{ vars.OVERLOOK_DML_ARM64_RUNNER == 'true' }}
          E2E_GATE: ${{ needs.e2e-gate.result }}
          DOCS_GOV: ${{ needs.docs-gov.result }}
          CODEQL: ${{ needs.codeql.result }}
          WORKFLOW_RUNTIME: ${{ needs.workflow-runtime.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
        run: |
          test "$POLICY" = success
          test "$WORKFLOW_RUNTIME" = success
          if [ "$DML_ARM64_ENABLED" = true ]; then
            DML_EXPECTED=success
          else
            DML_EXPECTED=skipped
          fi
          case "$MODE" in
            full)
              test "$DML_ARM64" = "$DML_EXPECTED"
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$COMPLETE" = success
                test "$WINDOWS_TESTS" = success
                test "$E2E_GATE" = success
                test "$DOCS_GOV" = success
                test "$CODEQL" = success
              fi
              ;;
            queue|manual)
              test "$DML_ARM64" = "$DML_EXPECTED"
              test "$COMPLETE" = success
              test "$WINDOWS_TESTS" = success
              test "$E2E_GATE" = success
              test "$DOCS_GOV" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              test "$WINDOWS_MAIN" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$COMPLETE" = success
                test "$E2E_GATE" = success
                test "$DOCS_GOV" = success
              fi
              ;;
            *) exit 1 ;;
          esac
      - name: Reject cancellation after verdict
        if: ${{ cancelled() }}
        run: exit 1
